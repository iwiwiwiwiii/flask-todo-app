name: Native CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: python:2.7-slim

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite Database
      run: |
        python manage.py db upgrade

    - name: Smoke test Flask server
      run: |
        python manage.py runserver -h 0.0.0.0 -p 7345 &
        sleep 5
        python -c "import urllib2; urllib2.urlopen('http://localhost:7345/')" || exit 1